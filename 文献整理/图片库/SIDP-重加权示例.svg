<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
  <rect x="0" y="0" width="1600" height="720" fill="#ffffff"/>

  <!-- ================= 左：两个分布 ================= -->
  <text x="450" y="80" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#111111">① 策略分布 &#960;<tspan font-size="19" dy="7">&#952;</tspan><tspan font-size="28" dy="-7"> 与目标分布 p*</tspan></text>

  <line x1="100" y1="580" x2="830" y2="580" stroke="#111111" stroke-width="3"/>
  <line x1="100" y1="580" x2="100" y2="115" stroke="#111111" stroke-width="3"/>

  <!-- y 刻度 -->
  <line x1="95" y1="580" x2="105" y2="580" stroke="#111111" stroke-width="2.5"/>
  <line x1="95" y1="452" x2="105" y2="452" stroke="#111111" stroke-width="2.5"/>
  <line x1="95" y1="324" x2="105" y2="324" stroke="#111111" stroke-width="2.5"/>
  <line x1="95" y1="196" x2="105" y2="196" stroke="#111111" stroke-width="2.5"/>
  <text x="88" y="588" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#555555">0</text>
  <text x="88" y="460" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#555555">0.2</text>
  <text x="88" y="332" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#555555">0.4</text>
  <text x="88" y="204" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#555555">0.6</text>
  <text x="42" y="360" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#111111" transform="rotate(-90 42 360)">概率密度</text>

  <!-- x 刻度：a = -1,0,1,2,3,4 -->
  <line x1="100" y1="576" x2="100" y2="584" stroke="#111111" stroke-width="2.5"/>
  <line x1="230" y1="576" x2="230" y2="584" stroke="#111111" stroke-width="2.5"/>
  <line x1="360" y1="576" x2="360" y2="584" stroke="#111111" stroke-width="2.5"/>
  <line x1="490" y1="576" x2="490" y2="584" stroke="#111111" stroke-width="2.5"/>
  <line x1="620" y1="576" x2="620" y2="584" stroke="#111111" stroke-width="2.5"/>
  <line x1="750" y1="576" x2="750" y2="584" stroke="#111111" stroke-width="2.5"/>
  <text x="100" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">&#8722;1</text>
  <text x="230" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">0</text>
  <text x="360" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">1</text>
  <text x="490" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">2</text>
  <text x="620" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">3</text>
  <text x="750" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555555">4</text>
  <text x="465" y="650" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#111111">动作 a</text>

  <!-- pi_theta = N(2,1) -->
  <polyline points="100,577.2 165,568.8 230,545.4 295,497.1 360,425.1 425,354.7 490,324.7 555,354.7 620,425.1 685,497.1 750,545.4 815,568.8"
            fill="none" stroke="#1565c0" stroke-width="4"/>
  <text x="500" y="300" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1565c0">&#960;<tspan font-size="16" dy="6">&#952;</tspan><tspan font-size="22" dy="-6"> = N(2, 1)</tspan></text>

  <!-- p* = N(2/3,1/3) -->
  <polyline points="100,573.2 165,522.6 230,353.0 295,155.8 316.7,137.8 360,205.7 425,424.0 490,549.3 555,577.1 620,579.9 685,580 750,580 815,580"
            fill="none" stroke="#e65100" stroke-width="4"/>
  <text x="330" y="120" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" fill="#e65100">p* &#8733; &#960;<tspan font-size="15" dy="6">&#952;</tspan><tspan font-size="21" dy="-6"> · e</tspan><tspan font-size="15" dy="-8">&#8722;a&#178;</tspan><tspan font-size="21" dy="8"> = N(2/3, 1/3)</tspan></text>

  <!-- 6 个候选 -->
  <g stroke="#111111" stroke-width="2">
    <line x1="334" y1="580" x2="334" y2="600"/>
    <line x1="386" y1="580" x2="386" y2="600"/>
    <line x1="477" y1="580" x2="477" y2="600"/>
    <line x1="503" y1="580" x2="503" y2="600"/>
    <line x1="541" y1="580" x2="541" y2="600"/>
    <line x1="580" y1="580" x2="580" y2="600"/>
  </g>
  <circle cx="334" cy="580" r="7" fill="#2e7d32"/>
  <circle cx="386" cy="580" r="7" fill="#2e7d32"/>
  <circle cx="477" cy="580" r="7" fill="#2e7d32"/>
  <circle cx="503" cy="580" r="7" fill="#2e7d32"/>
  <circle cx="541" cy="580" r="7" fill="#ffffff" stroke="#999999" stroke-width="3"/>
  <circle cx="580" cy="580" r="7" fill="#ffffff" stroke="#999999" stroke-width="3"/>

  <text x="420" y="690" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#2e7d32">绿点 = 按奖励排前 4，保留；灰圈 = 被 top-k 截断</text>

  <!-- ================= 右：权重柱状图 ================= -->
  <text x="1230" y="80" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#111111">② 归一化重要性权重 w</text>

  <line x1="960" y1="580" x2="1520" y2="580" stroke="#111111" stroke-width="3"/>
  <line x1="960" y1="580" x2="960" y2="180" stroke="#111111" stroke-width="3"/>
  <text x="920" y="380" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#111111" transform="rotate(-90 920 380)">权重 w</text>

  <rect x="1000" y="230" width="80" height="350" fill="#2e7d32" fill-opacity="0.75"/>
  <rect x="1120" y="422.6" width="80" height="157.4" fill="#2e7d32" fill-opacity="0.55"/>
  <rect x="1240" y="561.9" width="80" height="18.1" fill="#2e7d32" fill-opacity="0.35"/>
  <rect x="1360" y="572.0" width="80" height="8.0" fill="#2e7d32" fill-opacity="0.25"/>

  <text x="1040" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#111111">0.656</text>
  <text x="1160" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#111111">0.295</text>
  <text x="1280" y="547" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#111111">0.034</text>
  <text x="1400" y="557" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#111111">0.015</text>

  <text x="1040" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111111">0.8</text>
  <text x="1160" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111111">1.2</text>
  <text x="1280" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111111">1.9</text>
  <text x="1400" y="612" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111111">2.1</text>
  <text x="1040" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#c62828">r = &#8722;0.64</text>
  <text x="1160" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#c62828">&#8722;1.44</text>
  <text x="1280" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#c62828">&#8722;3.61</text>
  <text x="1400" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#c62828">&#8722;4.41</text>

  <text x="1240" y="700" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#555555">权重直接乘在各自的去噪损失上：L = &#931; w&#7522; L&#7522;</text>
</svg>
