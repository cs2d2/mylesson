  <text x="400" y="166" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" fill="#555555">条件数 &#954; = &#955;<tspan font-size="17" dy="5">max</tspan><tspan font-size="24" dy="-5"> / &#955;</tspan><tspan font-size="17" dy="5">min</tspan><tspan font-size="24" dy="-5"> &#8811; 1</tspan></text>

