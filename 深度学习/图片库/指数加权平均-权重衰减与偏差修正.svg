<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640">
  <rect x="0" y="0" width="1400" height="640" fill="#ffffff"/>

  <!-- ================= 左：权重衰减与 1/e ================= -->
  <text x="300" y="100" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="bold" fill="#111111">① 权重按 &#946;<tspan font-size="18" dy="-8">k</tspan><tspan font-size="26" dy="8"> 衰减：窗口由 1/(1&#8722;&#946;) 决定</tspan></text>

  <line x1="110" y1="560" x2="486" y2="560" stroke="#111111" stroke-width="3"/>
  <line x1="110" y1="560" x2="110" y2="160" stroke="#111111" stroke-width="3"/>

  <!-- 柱：beta = 0.9, k = 0..15 -->
  <rect x="120" y="180.0" width="14" height="380.0" fill="#9db8d2"/>
  <rect x="137" y="218.0" width="14" height="342.0" fill="#9db8d2"/>
  <rect x="154" y="252.2" width="14" height="307.8" fill="#9db8d2"/>
  <rect x="171" y="283.0" width="14" height="277.0" fill="#9db8d2"/>
  <rect x="188" y="310.7" width="14" height="249.3" fill="#9db8d2"/>
  <rect x="205" y="335.6" width="14" height="224.4" fill="#9db8d2"/>
  <rect x="222" y="358.1" width="14" height="201.9" fill="#9db8d2"/>
  <rect x="239" y="378.2" width="14" height="181.8" fill="#9db8d2"/>
  <rect x="256" y="396.4" width="14" height="163.6" fill="#9db8d2"/>
  <rect x="273" y="412.8" width="14" height="147.2" fill="#9db8d2"/>
  <rect x="290" y="427.5" width="14" height="132.5" fill="#c62828"/>
  <rect x="307" y="440.8" width="14" height="119.2" fill="#cfd8e3"/>
  <rect x="324" y="452.7" width="14" height="107.3" fill="#cfd8e3"/>
  <rect x="341" y="463.4" width="14" height="96.6" fill="#cfd8e3"/>
  <rect x="358" y="473.1" width="14" height="86.9" fill="#cfd8e3"/>
  <rect x="375" y="481.8" width="14" height="78.2" fill="#cfd8e3"/>

  <!-- 1/e 线 -->
  <line x1="110" y1="420.2" x2="470" y2="420.2" stroke="#c62828" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="478" y="428" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#c62828">1/e &#8776; 0.37</text>

  <!-- k = 1/(1-beta) 竖线 -->
  <line x1="297" y1="420.2" x2="297" y2="180" stroke="#c62828" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="297" y="166" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#c62828">k = 1/(1&#8722;&#946;) = 10</text>

  <text x="100" y="188" text-anchor="end" font-family="Georgia, serif" font-size="21" fill="#555555">1.0</text>
  <text x="100" y="378" text-anchor="end" font-family="Georgia, serif" font-size="21" fill="#555555">0.5</text>
  <text x="100" y="568" text-anchor="end" font-family="Georgia, serif" font-size="21" fill="#555555">0</text>
  <text x="38" y="360" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111" transform="rotate(-90 38 360)">权重 &#946;<tspan font-size="16" dy="-7">k</tspan></text>
  <text x="110" y="600" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111">距当前步数 k &#8594;</text>

  <!-- ================= 右：偏差修正 ================= -->
  <text x="1090" y="100" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="bold" fill="#111111">② 偏差修正：为什么要除以 1&#8722;&#946;<tspan font-size="18" dy="-8">t</tspan></text>

  <line x1="880" y1="560" x2="1320" y2="560" stroke="#111111" stroke-width="3"/>
  <line x1="880" y1="560" x2="880" y2="150" stroke="#111111" stroke-width="3"/>

  <!-- 无修正曲线 -->
  <polyline points="880,560 894,520 908,484 922,451.6 936,422.4 950,396.2 964,372.6 978,351.3 992,332.2 1006,315.0 1020,299.5 1048,273.0 1076,251.5 1104,234.0 1132,220.0 1160,208.6 1188,199.4 1216,191.9 1244,185.9 1272,181.2 1300,177.0"
            fill="none" stroke="#999999" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="1050" y="430" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#777777">无修正 V<tspan font-size="16" dy="5">t</tspan><tspan font-size="23" dy="-5">：从 0 开始慢慢爬</tspan></text>

  <!-- 修正后 -->
  <line x1="880" y1="160" x2="1300" y2="160" stroke="#1565c0" stroke-width="5"/>
  <text x="886" y="140" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#1565c0">修正后 V<tspan font-size="16" dy="5">t</tspan><tspan font-size="23" dy="-5"> / (1&#8722;&#946;</tspan><tspan font-size="16" dy="5">t</tspan><tspan font-size="23" dy="-5">) &#8801; 真值</tspan></text>

  <!-- t = 10 竖线 -->
  <line x1="1020" y1="160" x2="1020" y2="560" stroke="#c62828" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1030" y="600" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#c62828">t = 1/(1&#8722;&#946;) = 10 时仍有 36% 偏差</text>

  <text x="900" y="596" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111">步数 t</text>
  <text x="845" y="360" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111" transform="rotate(-90 845 360)">V<tspan font-size="16" dy="5">t</tspan></text>
</svg>
