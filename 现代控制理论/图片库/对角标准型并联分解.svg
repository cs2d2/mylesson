<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 135 885 610" width="885" height="610">
  <defs>
    <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" viewBox="0 0 18 18">
      <path d="M1,1.4 L17,9 L1,16.6 Z" fill="#111111"/>
    </marker>
    <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" viewBox="0 0 18 18">
      <path d="M1,1.4 L17,9 L1,16.6 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>

  <!-- 输入 u 与分配母线 -->
  <circle cx="90" cy="390" r="8" fill="#111111"/>
  <text x="128" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#111111">u</text>
  <line x1="98" y1="390" x2="166" y2="390" stroke="#111111" stroke-width="3.5" marker-end="url(#aDark)"/>
  <line x1="170" y1="210" x2="170" y2="700" stroke="#111111" stroke-width="3"/>

  <!-- 第 1 个模态 -->
  <line x1="170" y1="210" x2="266" y2="210" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="214" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#946;<tspan font-size="20" dy="6">1</tspan></text>
  <rect x="270" y="172" width="170" height="76" rx="8" fill="#fbfbfb" stroke="#111111" stroke-width="4"/>
  <text x="355" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#111111">1/(s&#8722;&#955;<tspan font-size="18" dy="5">1</tspan><tspan dy="-5">)</tspan></text>
  <line x1="440" y1="210" x2="556" y2="210" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="498" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#947;<tspan font-size="20" dy="6">1</tspan></text>

  <!-- 第 2 个模态 -->
  <line x1="170" y1="390" x2="266" y2="390" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="214" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#946;<tspan font-size="20" dy="6">2</tspan></text>
  <rect x="270" y="352" width="170" height="76" rx="8" fill="#fbfbfb" stroke="#111111" stroke-width="4"/>
  <text x="355" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#111111">1/(s&#8722;&#955;<tspan font-size="18" dy="5">2</tspan><tspan dy="-5">)</tspan></text>
  <line x1="440" y1="390" x2="556" y2="390" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="498" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#947;<tspan font-size="20" dy="6">2</tspan></text>

  <!-- 第 3 个模态 -->
  <line x1="170" y1="570" x2="266" y2="570" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="214" y="552" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#946;<tspan font-size="20" dy="6">3</tspan></text>
  <rect x="270" y="532" width="170" height="76" rx="8" fill="#fbfbfb" stroke="#111111" stroke-width="4"/>
  <text x="355" y="582" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#111111">1/(s&#8722;&#955;<tspan font-size="18" dy="5">3</tspan><tspan dy="-5">)</tspan></text>
  <line x1="440" y1="570" x2="556" y2="570" stroke="#111111" stroke-width="3" marker-end="url(#aDark)"/>
  <text x="498" y="552" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#111111">&#947;<tspan font-size="20" dy="6">3</tspan></text>

  <!-- 并联求和 -->
  <line x1="560" y1="210" x2="560" y2="570" stroke="#111111" stroke-width="3"/>
  <circle cx="560" cy="210" r="6" fill="#111111"/>
  <circle cx="560" cy="390" r="6" fill="#111111"/>
  <circle cx="560" cy="570" r="6" fill="#111111"/>
  <line x1="560" y1="390" x2="626" y2="390" stroke="#111111" stroke-width="3.5" marker-end="url(#aDark)"/>

  <circle cx="670" cy="390" r="42" fill="#f2f2f2" stroke="#111111" stroke-width="3.5"/>
  <text x="670" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#111111">&#931;</text>

  <!-- 直通支路 D = b0 -->
  <path d="M 170 700 L 670 700 L 670 436" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="420" y="682" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#1565c0">b<tspan font-size="21" dy="6">0</tspan></text>

  <!-- 输出 -->
  <line x1="712" y1="390" x2="838" y2="390" stroke="#111111" stroke-width="3.5" marker-end="url(#aDark)"/>
  <text x="866" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="36" fill="#111111">y</text>
</svg>
