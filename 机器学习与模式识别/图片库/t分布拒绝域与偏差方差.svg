<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" width="1800" height="880">
  <defs>
    <marker id="ax" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13.6" refY="8" orient="auto" viewBox="0 0 16 16">
      <path d="M0.8,1.2 L15.2,8 L0.8,14.8 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="880" fill="#ffffff"/>

  <!-- ==================== 左：t 分布与拒绝域 ==================== -->
  <text x="100" y="100" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#111111">① 成对 t 检验：t 分布与拒绝域（自由度 ν = 9）</text>

  <!-- 拒绝域（双侧） -->
  <path d="M 256.9,657.1 L 245,670.9 L 220,687.3 L 195,694.5 L 170,697.5 L 145,698.9 L 120,699.5 L 120,700 L 256.9,700 Z"
        fill="#c62828" fill-opacity="0.18"/>
  <path d="M 483.1,657.1 L 495,670.9 L 520,687.3 L 545,694.5 L 570,697.5 L 595,698.9 L 620,699.5 L 620,700 L 483.1,700 Z"
        fill="#c62828" fill-opacity="0.18"/>

  <!-- 坐标轴 -->
  <line x1="120" y1="700" x2="648" y2="700" stroke="#111111" stroke-width="3" marker-end="url(#ax)"/>
  <line x1="120" y1="700" x2="120" y2="270" stroke="#111111" stroke-width="3"/>
  <text x="370" y="745" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111">t 值</text>
  <text x="88" y="470" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111" transform="rotate(-90 88 470)">概率密度</text>

  <!-- 刻度 -->
  <line x1="170" y1="696" x2="170" y2="706" stroke="#111111" stroke-width="3"/>
  <line x1="270" y1="696" x2="270" y2="706" stroke="#111111" stroke-width="3"/>
  <line x1="370" y1="696" x2="370" y2="706" stroke="#111111" stroke-width="3"/>
  <line x1="470" y1="696" x2="470" y2="706" stroke="#111111" stroke-width="3"/>
  <line x1="570" y1="696" x2="570" y2="706" stroke="#111111" stroke-width="3"/>
  <text x="170" y="738" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#555555">&#8722;4</text>
  <text x="270" y="738" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#555555">&#8722;2</text>
  <text x="370" y="738" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#555555">0</text>
  <text x="470" y="738" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#555555">2</text>
  <text x="570" y="738" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#555555">4</text>

  <!-- t 分布密度曲线（ν = 9） -->
  <polyline points="120,699.5 145,698.9 170,697.5 195,694.5 220,687.3 245,670.9 256.9,657.1 270,635.2 295,566.5 320,459.4 345,344.7 357.5,306.5 370,292.6 382.5,306.5 395,344.7 420,459.4 445,566.5 470,635.2 483.1,657.1 495,670.9 520,687.3 545,694.5 570,697.5 595,698.9 620,699.5"
            fill="none" stroke="#111111" stroke-width="4.5"/>

  <!-- 临界值 -->
  <line x1="256.9" y1="657.1" x2="256.9" y2="700" stroke="#c62828" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="483.1" y1="657.1" x2="483.1" y2="700" stroke="#c62828" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="248" y="634" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" fill="#c62828">t = &#8722;2.262</text>
  <text x="492" y="634" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" fill="#c62828">t = 2.262</text>
  <text x="188" y="666" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#c62828">拒绝域</text>
  <text x="551" y="666" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#c62828">拒绝域</text>

  <!-- 观测到的统计量 -->
  <line x1="197" y1="694.1" x2="197" y2="770" stroke="#c62828" stroke-width="3"/>
  <circle cx="197" cy="694.1" r="7" fill="#c62828"/>
  <text x="208" y="790" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#c62828">观测值 &#964; = &#8722;3.46（落在拒绝域内 → 拒绝原假设）</text>

  <!-- ==================== 右：偏差-方差分解 ==================== -->
  <text x="1000" y="100" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#111111">② 偏差-方差分解与模型复杂度</text>

  <line x1="1020" y1="750" x2="1758" y2="750" stroke="#111111" stroke-width="3" marker-end="url(#ax)"/>
  <line x1="1020" y1="750" x2="1020" y2="140" stroke="#111111" stroke-width="3" marker-end="url(#ax)"/>
  <text x="1700" y="802" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111">模型复杂度 →</text>
  <text x="975" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#111111" transform="rotate(-90 975 450)">误差</text>

  <!-- 噪声 -->
  <line x1="1020" y1="706" x2="1720" y2="706" stroke="#777777" stroke-width="2.5" stroke-dasharray="11 8"/>
  <text x="1712" y="698" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" fill="#666666">噪声（不可消除）</text>

  <!-- 偏差平方 -->
  <polyline points="1020,282.5 1090,410.5 1160,503.5 1230,571.0 1300,620.0 1370,655.6 1440,681.5 1510,700.2 1580,713.9 1650,723.8 1720,730.9"
            fill="none" stroke="#2e7d32" stroke-width="3.5"/>
  <text x="1125" y="428" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#2e7d32">偏差&#178;</text>

  <!-- 方差 -->
  <polyline points="1020,695.0 1090,690.9 1160,678.5 1230,657.9 1300,629.0 1370,591.9 1440,546.5 1510,492.9 1580,431.0 1650,360.9 1720,282.5"
            fill="none" stroke="#1565c0" stroke-width="3.5"/>
  <text x="1600" y="470" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#1565c0">方差</text>

  <!-- 总误差 -->
  <polyline points="1020,183.5 1090,307.4 1160,388.0 1230,434.8 1300,455.0 1335,456.7 1370,453.5 1440,434.0 1510,399.1 1580,350.9 1650,290.6 1720,219.4"
            fill="none" stroke="#c62828" stroke-width="5"/>
  <text x="1300" y="360" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#c62828">总误差 = 偏差&#178; + 方差 + 噪声</text>

  <!-- 最优点 -->
  <line x1="1335" y1="456.7" x2="1335" y2="750" stroke="#c62828" stroke-width="2.5" stroke-dasharray="9 7"/>
  <circle cx="1335" cy="456.7" r="8" fill="#c62828"/>
  <text x="1335" y="792" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#c62828">误差最小的复杂度</text>

  <!-- 两侧区域 -->
  <text x="1090" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#555555">欠拟合（偏差主导）</text>
  <text x="1580" y="200" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#555555">过拟合（方差主导）</text>
</svg>
